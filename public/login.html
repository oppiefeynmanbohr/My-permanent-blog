<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — My Permanent Blog</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-shell { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#fdf6ee; padding:24px; }
    .auth-card { background:#fff; border-radius:12px; box-shadow:0 2px 16px rgba(0,0,0,0.1); padding:32px; width:100%; max-width:420px; }
    .auth-card h1 { margin:0 0 16px; font-size:1.5rem; color:#3a2a1a; }
    .tab-row { display:flex; border-bottom:2px solid #e8c99a; margin-bottom:22px; }
    .tab-btn { flex:1; background:none; border:none; padding:10px; font-size:0.95em; font-weight:bold; color:#a07850; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .15s,border-color .15s; }
    .tab-btn.active { color:#3a2a1a; border-bottom-color:#c8a97e; }
    .auth-field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    .auth-field label { font-size:0.85em; font-weight:bold; color:#5a3e28; }
    .auth-field input { padding:10px 12px; border:1px solid #ccc; border-radius:6px; font-size:1em; box-sizing:border-box; width:100%; }
    .auth-field input:focus { outline:2px solid #c8a97e; border-color:#c8a97e; }
    .auth-remember { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:0.9em; color:#5a3e28; cursor:pointer; }
    .auth-remember input[type=checkbox] { width:16px; height:16px; accent-color:#c8a97e; cursor:pointer; }
    .auth-submit { width:100%; background:#c8a97e; color:#fff; border:none; border-radius:8px; padding:12px; font-size:1em; font-weight:bold; cursor:pointer; margin-top:4px; }
    .auth-submit:hover { background:#b8936a; }
    .auth-submit:disabled { opacity:0.6; cursor:not-allowed; }
    .auth-status { font-size:0.9em; color:#c62828; text-align:center; min-height:20px; margin-bottom:10px; }
    .auth-status.ok { color:#2e7d32; }
    .forgot-link { text-align:right; font-size:0.82em; margin-top:-8px; margin-bottom:14px; }
    .forgot-link a { color:#c8a97e; text-decoration:none; }
    .forgot-link a:hover { text-decoration:underline; }
    .back-link { text-align:center; margin-top:18px; font-size:0.9em; color:#888; }
    .back-link a { color:#c8a97e; text-decoration:none; font-weight:bold; }
    .panel { display:none; }
    .panel.active { display:block; }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>My Permanent Blog</h1>
      <div id="account-switch-message" class="auth-status" style="display:none;"></div>
      <button class="auth-submit" id="new-user-btn" type="button" style="margin:0 0 16px;">I am a new user</button>

      <div class="tab-row">
        <button class="tab-btn active" id="tab-login" onclick="showTab('login')">Log In</button>
        <button class="tab-btn" id="tab-signup" onclick="showTab('signup')">Sign Up</button>
      </div>

      <!-- ── Log In panel ── -->
      <div id="panel-login" class="panel active">
        <form id="login-form" autocomplete="on" onsubmit="return false;">
          <div class="auth-field" id="saved-accounts-field" style="display:none;">
            <label for="saved-account-select">Choose a saved account on this device</label>
            <select id="saved-account-select"></select>
          </div>
          <div class="auth-field">
            <label for="login-username">Username or Email</label>
            <input id="login-username" name="username" type="text" placeholder="Your username or email" autocomplete="username" />
          </div>
          <div class="auth-field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" placeholder="Your password" autocomplete="current-password" />
          </div>
          <div class="forgot-link"><a href="/reset-password">Forgot password?</a></div>
          <label class="auth-remember">
            <input id="remember-email" type="checkbox" /> Remember my email on this device
          </label>
          <label class="auth-remember">
            <input id="remember-me" type="checkbox" checked /> Keep me signed in on this personal device
          </label>
          <div id="login-status" class="auth-status"></div>
          <button class="auth-submit" id="login-btn" type="submit">Log In</button>
        </form>
      </div>

      <!-- ── Sign Up panel ── -->
      <div id="panel-signup" class="panel">
        <form id="signup-form" autocomplete="on" onsubmit="return false;">
          <div class="auth-field">
            <label for="signup-username">Username</label>
            <input id="signup-username" name="new-username" type="text" placeholder="Choose a username" autocomplete="username" />
          </div>
          <div class="auth-field">
            <label for="signup-email">Email address</label>
            <input id="signup-email" name="email" type="email" placeholder="your@email.com" autocomplete="email" />
          </div>
          <div class="auth-field">
            <label for="signup-password">Password</label>
            <input id="signup-password" name="new-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" />
          </div>
          <div class="auth-field">
            <label for="signup-confirm">Confirm password</label>
            <input id="signup-confirm" name="confirm-password" type="password" placeholder="Repeat your password" autocomplete="new-password" />
          </div>
          <div id="signup-status" class="auth-status"></div>
          <button class="auth-submit" id="signup-btn" type="submit">Create Account</button>
        </form>
      </div>

      <div class="back-link"><a href="/page1">← Back to blog</a></div>
    </div>
  </div>

  <script>
    function showTab(tab) {
      document.getElementById('panel-login').classList.toggle('active', tab === 'login');
      document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    }

    const creatingNewAccount = new URLSearchParams(window.location.search).get('new') === '1';
    const accountSwitchMessage = document.getElementById('account-switch-message');

    // Auto-switch to signup if directed from Sign Up button on blog
    if (creatingNewAccount || localStorage.getItem('auth_tab') === 'signup') {
      localStorage.removeItem('auth_tab');
      showTab('signup');
    }

    document.getElementById('new-user-btn').addEventListener('click', () => {
      window.location.assign('/logout?new=1');
    });

    function getBrowserId() {
      let browserId = localStorage.getItem('blog_browser_id');
      if (!browserId) {
        browserId = 'browser-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('blog_browser_id', browserId);
      }
      return browserId;
    }

    function clearLegacyPasswordStorage() {
      localStorage.removeItem('blog_saved_password');
      localStorage.removeItem('blog_password');
      document.cookie = 'blog_saved_password=; Max-Age=0; Path=/; SameSite=Lax';
    }

    clearLegacyPasswordStorage();
    function getKnownAccounts() {
      try {
        const accounts = JSON.parse(localStorage.getItem('blog_known_accounts') || '[]');
        return Array.isArray(accounts) ? accounts.filter((account) => account && account.username) : [];
      } catch {
        return [];
      }
    }

    function rememberAccount(username, email = '') {
      const normalized = String(username || '').trim();
      if (!normalized) return;
      const accounts = getKnownAccounts().filter((account) => account.username.toLowerCase() !== normalized.toLowerCase());
      accounts.unshift({ username: normalized, email: String(email || '').trim().toLowerCase() });
      localStorage.setItem('blog_known_accounts', JSON.stringify(accounts.slice(0, 20)));
      renderKnownAccounts();
    }

    function renderKnownAccounts() {
      const field = document.getElementById('saved-accounts-field');
      const select = document.getElementById('saved-account-select');
      const accounts = getKnownAccounts();
      if (!accounts.length) return;
      select.replaceChildren();
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Select an account';
      select.appendChild(placeholder);
      accounts.forEach((account) => {
        const option = document.createElement('option');
        option.value = account.email || account.username;
        option.textContent = account.email ? `${account.username} (${account.email})` : account.username;
        select.appendChild(option);
      });
      field.style.display = 'flex';
    }

    document.getElementById('saved-account-select').addEventListener('change', (event) => {
      const username = event.target.value;
      if (!username) return;
      document.getElementById('login-username').value = username;
      document.getElementById('login-password').focus();
    });

    renderKnownAccounts();
    const savedEmail = localStorage.getItem('blog_saved_email') || '';
    if (savedEmail) {
      document.getElementById('login-username').value = savedEmail;
      document.getElementById('remember-email').checked = true;
    }

    // ── Log In ──
    const loginBtn = document.getElementById('login-btn');
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('login-status');
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const rememberMe = document.getElementById('remember-me').checked;
      const rememberEmail = document.getElementById('remember-email').checked;
      if (!username || !password) { statusEl.textContent = 'Please enter your username or email, and password.'; return; }
      statusEl.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in…';
      try {
        const browserId = getBrowserId();
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password, rememberMe, browserId })
        });
        const data = await r.json();
        if (!r.ok) {
          const msg = data.error || 'Login failed.';
          const isNotFound = msg.toLowerCase().includes('no account');
          statusEl.textContent = msg + (isNotFound ? ' — try the Sign Up tab to create a new account.' : '');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log In';
          return;
        }
        localStorage.setItem('blog_logged_in', '1');
        localStorage.setItem('blog_username', data.username || username);
        localStorage.setItem('blog_browser_id', getBrowserId());
        rememberAccount(data.username || username, data.email || (username.includes('@') ? username : ''));
        if (rememberEmail) localStorage.setItem('blog_saved_email', data.email || username);
        else localStorage.removeItem('blog_saved_email');
        statusEl.className = 'auth-status ok';
        statusEl.textContent = 'Logged in! Redirecting…';
        setTimeout(() => { window.location.href = '/page1'; }, 600);
      } catch {
        statusEl.textContent = 'Network error. Try again.';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });

    // ── Sign Up ──
    const signupBtn = document.getElementById('signup-btn');
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('signup-status');
      const username = document.getElementById('signup-username').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      if (!username || !email || !password) { statusEl.textContent = 'Please fill in all fields.'; return; }
      if (password !== confirm) { statusEl.textContent = 'Passwords do not match.'; return; }
      if (password.length < 6) { statusEl.textContent = 'Password must be at least 6 characters.'; return; }
      statusEl.textContent = '';
      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating account…';
      try {
        const r = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, email, password })
        });
        const data = await r.json();
        if (!r.ok) {
          statusEl.textContent = data.error || 'Sign up failed.';
          signupBtn.disabled = false;
          signupBtn.textContent = 'Create Account';
          return;
        }
        localStorage.setItem('blog_logged_in', '1');
        localStorage.setItem('blog_username', data.username || username);
        localStorage.setItem('blog_user_id', String(data.userId || ''));
        rememberAccount(data.username || username, data.email || email);
        statusEl.className = 'auth-status ok';
        statusEl.textContent = 'Personal blog created! Redirecting…';
        setTimeout(() => { window.location.href = '/page1'; }, 600);
      } catch {
        statusEl.textContent = 'Network error. Try again.';
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
      }
    });

    async function verifySignupFromLink() {
      const token = new URLSearchParams(window.location.search).get('verify');
      if (!token) return false;
      const statusEl = document.getElementById('signup-status');
      showTab('signup');
      statusEl.className = 'auth-status';
      statusEl.textContent = 'Verifying your email address…';
      try {
        const response = await fetch('/api/auth/signup/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ token })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          statusEl.textContent = data.error || 'Email verification failed.';
          return true;
        }
        localStorage.setItem('blog_logged_in', '1');
        localStorage.setItem('blog_username', data.username || '');
        history.replaceState({}, '', '/login');
        statusEl.className = 'auth-status ok';
        statusEl.textContent = 'Email verified! Redirecting…';
        setTimeout(() => { window.location.href = '/page1'; }, 600);
        return true;
      } catch {
        statusEl.textContent = 'Network error. Try opening the verification link again.';
        return true;
      }
    }

    verifySignupFromLink().then((verifying) => {
      if (verifying) return;
      fetch('/api/auth/session', { credentials: 'same-origin' })
        .then(r => r.json())
        .then((data) => {
          if (data.authenticated && accountSwitchMessage) {
            accountSwitchMessage.style.display = 'block';
            accountSwitchMessage.textContent = 'Another user is signed in. Enter your own email and password below, or choose I am a new user.';
          }
        })
        .catch(() => {});
    });
  </script>
  <script src="/global-nav.js"></script>
</body>
</html>
