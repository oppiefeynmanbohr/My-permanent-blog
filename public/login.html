<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — My Permanent Blog</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-shell { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#fdf6ee; padding:24px; }
    .auth-card { background:#fff; border-radius:12px; box-shadow:0 2px 16px rgba(0,0,0,0.1); padding:32px; width:100%; max-width:420px; }
    .auth-card h1 { margin:0 0 16px; font-size:1.5rem; color:#3a2a1a; }
    .tab-row { display:flex; border-bottom:2px solid #e8c99a; margin-bottom:22px; }
    .tab-btn { flex:1; background:none; border:none; padding:10px; font-size:0.95em; font-weight:bold; color:#a07850; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .15s,border-color .15s; }
    .tab-btn.active { color:#3a2a1a; border-bottom-color:#c8a97e; }
    .auth-field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    .auth-field label { font-size:0.85em; font-weight:bold; color:#5a3e28; }
    .auth-field input { padding:10px 12px; border:1px solid #ccc; border-radius:6px; font-size:1em; box-sizing:border-box; width:100%; }
    .auth-field input:focus { outline:2px solid #c8a97e; border-color:#c8a97e; }
    .auth-remember { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:0.9em; color:#5a3e28; cursor:pointer; }
    .auth-remember input[type=checkbox] { width:16px; height:16px; accent-color:#c8a97e; cursor:pointer; }
    .auth-submit { width:100%; background:#c8a97e; color:#fff; border:none; border-radius:8px; padding:12px; font-size:1em; font-weight:bold; cursor:pointer; margin-top:4px; }
    .auth-submit:hover { background:#b8936a; }
    .auth-submit:disabled { opacity:0.6; cursor:not-allowed; }
    .auth-status { font-size:0.9em; color:#c62828; text-align:center; min-height:20px; margin-bottom:10px; }
    .auth-status.ok { color:#2e7d32; }
    .forgot-link { text-align:right; font-size:0.82em; margin-top:-8px; margin-bottom:14px; }
    .forgot-link a { color:#c8a97e; text-decoration:none; }
    .forgot-link a:hover { text-decoration:underline; }
    .back-link { text-align:center; margin-top:18px; font-size:0.9em; color:#888; }
    .back-link a { color:#c8a97e; text-decoration:none; font-weight:bold; }
    .panel { display:none; }
    .panel.active { display:block; }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>My Permanent Blog</h1>

      <div class="tab-row">
        <button class="tab-btn active" id="tab-login" onclick="showTab('login')">Log In</button>
        <button class="tab-btn" id="tab-signup" onclick="showTab('signup')">Sign Up</button>
      </div>

      <!-- ── Log In panel ── -->
      <div id="panel-login" class="panel active">
        <form id="login-form" autocomplete="on" onsubmit="return false;">
          <div class="auth-field">
            <label for="login-username">Username or Email</label>
            <input id="login-username" type="text" placeholder="Your username or email" autocomplete="username" />
          </div>
          <div class="auth-field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" placeholder="Your password" autocomplete="current-password" />
          </div>
          <div class="forgot-link"><a href="/reset-password">Forgot password?</a></div>
          <label class="auth-remember">
            <input id="remember-me" type="checkbox" checked /> Keep me signed in
          </label>
          <div id="login-status" class="auth-status"></div>
          <button class="auth-submit" id="login-btn" type="submit">Log In</button>
        </form>
      </div>

      <!-- ── Sign Up panel ── -->
      <div id="panel-signup" class="panel">
        <form id="signup-form" autocomplete="on" onsubmit="return false;">
          <div class="auth-field">
            <label for="signup-username">Username</label>
            <input id="signup-username" type="text" placeholder="Choose a username" autocomplete="username" />
          </div>
          <div class="auth-field">
            <label for="signup-email">Email address</label>
            <input id="signup-email" type="email" placeholder="your@email.com" autocomplete="email" />
          </div>
          <div class="auth-field">
            <label for="signup-password">Password</label>
            <input id="signup-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" />
          </div>
          <div class="auth-field">
            <label for="signup-confirm">Confirm password</label>
            <input id="signup-confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" />
          </div>
          <div id="signup-status" class="auth-status"></div>
          <button class="auth-submit" id="signup-btn" type="submit">Create Account</button>
        </form>
      </div>

      <div class="back-link"><a href="/page1">← Back to blog</a></div>
    </div>
  </div>

  <script>
    function showTab(tab) {
      document.getElementById('panel-login').classList.toggle('active', tab === 'login');
      document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    }

    // Auto-switch to signup if directed from Sign Up button on blog
    if (localStorage.getItem('auth_tab') === 'signup') {
      localStorage.removeItem('auth_tab');
      showTab('signup');
    }

    function getBrowserId() {
      let browserId = localStorage.getItem('blog_browser_id');
      if (!browserId) {
        browserId = 'browser-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('blog_browser_id', browserId);
      }
      return browserId;
    }

    function persistSavedCredentials(username, password) {
      if (username) localStorage.setItem('blog_username', username);
      if (password) localStorage.setItem('blog_saved_password', password);
      if (password) localStorage.setItem('blog_password', password);
      if (username || password) {
        const expiry = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
        document.cookie = `blog_username=${encodeURIComponent(username || localStorage.getItem('blog_username') || '')}; expires=${expiry}; path=/; SameSite=Lax`;
        if (password) {
          document.cookie = `blog_saved_password=${encodeURIComponent(password)}; expires=${expiry}; path=/; SameSite=Lax`;
        }
      }
      if (!username && !password) return;
    }

    // Pre-fill username and password from saved login details
    const savedUser = localStorage.getItem('blog_username') || (() => {
      const match = document.cookie.match(/(?:^|; )blog_username=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : '';
    })();
    const savedPassword = localStorage.getItem('blog_saved_password') || localStorage.getItem('blog_password') || (() => {
      const match = document.cookie.match(/(?:^|; )blog_saved_password=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : '';
    })();
    if (savedUser) document.getElementById('login-username').value = savedUser;
    if (savedPassword) document.getElementById('login-password').value = savedPassword;

    const loginUsernameInput = document.getElementById('login-username');
    const loginPasswordInput = document.getElementById('login-password');
    [loginUsernameInput, loginPasswordInput].forEach((input) => {
      input.addEventListener('input', () => {
        persistSavedCredentials(loginUsernameInput.value.trim(), loginPasswordInput.value);
      });
    });

    async function tryStoredLogin() {
      const storedUser = localStorage.getItem('blog_username') || (() => {
        const match = document.cookie.match(/(?:^|; )blog_username=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : '';
      })();
      const storedPassword = localStorage.getItem('blog_saved_password') || localStorage.getItem('blog_password') || (() => {
        const match = document.cookie.match(/(?:^|; )blog_saved_password=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : '';
      })();
      if (!storedUser || !storedPassword) return false;
      const statusEl = document.getElementById('login-status');
      if (statusEl) statusEl.textContent = 'Restoring your last session…';
      try {
        const browserId = getBrowserId();
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username: storedUser, password: storedPassword, rememberMe: true, browserId })
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) return false;
        localStorage.setItem('blog_logged_in', '1');
        localStorage.setItem('blog_username', data.username || storedUser);
        localStorage.setItem('blog_saved_password', storedPassword);
        localStorage.setItem('blog_password', storedPassword);
        localStorage.setItem('blog_browser_id', browserId);
        persistSavedCredentials(data.username || storedUser, storedPassword);
        return true;
      } catch {
        return false;
      }
    }

    // ── Log In ──
    const loginBtn = document.getElementById('login-btn');
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('login-status');
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const rememberMe = true;
      if (!username || !password) { statusEl.textContent = 'Please enter your username or email, and password.'; return; }
      statusEl.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in…';
      try {
        const browserId = getBrowserId();
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password, rememberMe, browserId })
        });
        const data = await r.json();
        if (!r.ok) {
          const savedPassword = localStorage.getItem('blog_saved_password');
          const fallbackUsername = localStorage.getItem('blog_username');
          const canUseSavedPassword = savedPassword && fallbackUsername && fallbackUsername.toLowerCase() === username.toLowerCase();
          if (canUseSavedPassword && savedPassword === password) {
            localStorage.setItem('blog_logged_in', '1');
            localStorage.setItem('blog_username', fallbackUsername || username);
            localStorage.setItem('blog_saved_password', savedPassword);
            localStorage.setItem('blog_password', savedPassword);
            localStorage.setItem('blog_browser_id', getBrowserId());
            persistSavedCredentials(fallbackUsername || username, savedPassword);
            statusEl.className = 'auth-status ok';
            statusEl.textContent = 'Signed in using your saved browser password.';
            setTimeout(() => { window.location.href = '/page1'; }, 600);
            return;
          }
          const msg = data.error || 'Login failed.';
          const isNotFound = msg.toLowerCase().includes('no account');
          statusEl.textContent = msg + (isNotFound ? ' — try the Sign Up tab to create a new account.' : '');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log In';
          return;
        }
        localStorage.setItem('blog_logged_in', '1');
        localStorage.setItem('blog_username', data.username || username);
        localStorage.setItem('blog_saved_password', password);
        localStorage.setItem('blog_password', password);
        localStorage.setItem('blog_browser_id', getBrowserId());
        persistSavedCredentials(data.username || username, password);
        statusEl.className = 'auth-status ok';
        statusEl.textContent = 'Logged in! Redirecting…';
        setTimeout(() => { window.location.href = '/page1'; }, 600);
      } catch {
        statusEl.textContent = 'Network error. Try again.';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });

    // ── Sign Up ──
    const signupBtn = document.getElementById('signup-btn');
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('signup-status');
      const username = document.getElementById('signup-username').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      if (!username || !email || !password) { statusEl.textContent = 'Please fill in all fields.'; return; }
      if (password !== confirm) { statusEl.textContent = 'Passwords do not match.'; return; }
      if (password.length < 6) { statusEl.textContent = 'Password must be at least 6 characters.'; return; }
      statusEl.textContent = '';
      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating account…';
      try {
        const r = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, email, password })
        });
        const data = await r.json();
        if (!r.ok) {
          statusEl.textContent = data.error || 'Sign up failed.';
          signupBtn.disabled = false;
          signupBtn.textContent = 'Create Account';
          return;
        }
        localStorage.setItem('blog_logged_in', '1');
        localStorage.setItem('blog_username', username);
        localStorage.setItem('blog_saved_password', password);
        localStorage.setItem('blog_password', password);
        persistSavedCredentials(username, password);
        statusEl.className = 'auth-status ok';
        statusEl.textContent = 'Account created! Redirecting…';
        setTimeout(() => { window.location.href = '/page1'; }, 600);
      } catch {
        statusEl.textContent = 'Network error. Try again.';
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
      }
    });

    // Already logged in? Go straight to blog, or restore from the saved browser credentials.
    fetch('/api/auth/session', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(async (data) => {
        if (data.authenticated) {
          window.location.href = '/page1';
          return;
        }
        const restored = await tryStoredLogin();
        if (restored) window.location.href = '/page1';
      })
      .catch(async () => {
        const restored = await tryStoredLogin();
        if (restored) window.location.href = '/page1';
      });
  </script>
</body>
</html>
