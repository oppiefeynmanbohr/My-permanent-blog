<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — My Permanent Blog</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-shell { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#fdf6ee; padding:24px; }
    .auth-card { background:#fff; border-radius:12px; box-shadow:0 2px 16px rgba(0,0,0,0.1); padding:32px; width:100%; max-width:420px; }
    .auth-card h1 { margin:0 0 4px; font-size:1.5rem; color:#3a2a1a; }
    .auth-card .subtitle { color:#888; margin:0 0 24px; font-size:0.95em; }
    .auth-field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    .auth-field label { font-size:0.85em; font-weight:bold; color:#5a3e28; }
    .auth-field input { padding:10px 12px; border:1px solid #ccc; border-radius:6px; font-size:1em; box-sizing:border-box; width:100%; }
    .auth-field input:focus { outline:2px solid #c8a97e; border-color:#c8a97e; }
    .auth-submit { width:100%; background:#c8a97e; color:#fff; border:none; border-radius:8px; padding:12px; font-size:1em; font-weight:bold; cursor:pointer; margin-top:4px; }
    .auth-submit:hover { background:#b8936a; }
    .auth-submit:disabled { opacity:0.6; cursor:not-allowed; }
    .auth-status { font-size:0.9em; color:#c62828; text-align:center; min-height:20px; margin-bottom:10px; }
    .auth-status.ok { color:#2e7d32; }
    .back-link { text-align:center; margin-top:18px; font-size:0.9em; color:#888; }
    .back-link a { color:#c8a97e; text-decoration:none; font-weight:bold; }
    .panel { display:none; }
    .panel.active { display:block; }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>My Permanent Blog</h1>

      <!-- Request reset link panel -->
      <div id="panel-request" class="panel active">
        <p class="subtitle">Enter your email and we'll send you a reset link.</p>
        <div class="auth-field">
          <label for="email-input">Email address</label>
          <input id="email-input" type="email" placeholder="your@email.com" autocomplete="email" />
        </div>
        <div id="request-status" class="auth-status"></div>
        <button class="auth-submit" id="request-btn">Send Reset Link</button>
      </div>

      <!-- Sent confirmation panel -->
      <div id="panel-sent" class="panel">
        <p class="subtitle" style="color:#2e7d32;">Check your email for a reset link. It expires in 1 hour.</p>
        <p style="font-size:0.85em;color:#888;text-align:center;">Didn't get it? Check your spam folder or <a href="/reset-password.html" style="color:#c8a97e;">try again</a>.</p>
      </div>

      <!-- Set new password panel (when arriving via token link) -->
      <div id="panel-reset" class="panel">
        <p class="subtitle">Choose a new password for your account.</p>
        <div class="auth-field">
          <label for="new-password">New password</label>
          <input id="new-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" />
        </div>
        <div class="auth-field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" type="password" placeholder="Repeat your new password" autocomplete="new-password" />
        </div>
        <div id="reset-status" class="auth-status"></div>
        <button class="auth-submit" id="reset-btn">Set New Password</button>
      </div>

      <!-- Success panel -->
      <div id="panel-done" class="panel">
        <p class="subtitle" style="color:#2e7d32;">Password updated! You can now log in.</p>
        <a class="auth-submit" href="/login.html" style="display:block;text-align:center;text-decoration:none;margin-top:8px;">Go to Login</a>
      </div>

      <div class="back-link"><a href="/login.html">← Back to login</a></div>
    </div>
  </div>

  <script>
    function showPanel(id) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // Check for token in URL
    const params = new URLSearchParams(window.location.search);
    const resetToken = params.get('token');
    if (resetToken) showPanel('panel-reset');

    // Request reset link
    const requestBtn = document.getElementById('request-btn');
    const emailInput = document.getElementById('email-input');
    emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') requestBtn.click(); });

    requestBtn.addEventListener('click', async () => {
      const statusEl = document.getElementById('request-status');
      const email = emailInput.value.trim().toLowerCase();
      if (!email) { statusEl.textContent = 'Please enter your email address.'; return; }
      statusEl.textContent = '';
      requestBtn.disabled = true;
      requestBtn.textContent = 'Sending…';
      try {
        const r = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        // Always show "check email" regardless of result (don't leak account existence)
        showPanel('panel-sent');
      } catch {
        statusEl.textContent = 'Network error. Try again.';
        requestBtn.disabled = false;
        requestBtn.textContent = 'Send Reset Link';
      }
    });

    // Set new password
    const resetBtn = document.getElementById('reset-btn');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    confirmPasswordInput.addEventListener('keydown', e => { if (e.key === 'Enter') resetBtn.click(); });

    resetBtn.addEventListener('click', async () => {
      const statusEl = document.getElementById('reset-status');
      const password = newPasswordInput.value;
      const confirm = confirmPasswordInput.value;
      if (!password) { statusEl.textContent = 'Please enter a new password.'; return; }
      if (password.length < 6) { statusEl.textContent = 'Password must be at least 6 characters.'; return; }
      if (password !== confirm) { statusEl.textContent = 'Passwords do not match.'; return; }
      statusEl.textContent = '';
      resetBtn.disabled = true;
      resetBtn.textContent = 'Saving…';
      try {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, password })
        });
        const data = await r.json();
        if (!r.ok) {
          statusEl.textContent = data.error || 'Reset failed.';
          resetBtn.disabled = false;
          resetBtn.textContent = 'Set New Password';
          return;
        }
        showPanel('panel-done');
      } catch {
        statusEl.textContent = 'Network error. Try again.';
        resetBtn.disabled = false;
        resetBtn.textContent = 'Set New Password';
      }
    });
  </script>
  <script src="/global-nav.js"></script>
</body>
</html>
