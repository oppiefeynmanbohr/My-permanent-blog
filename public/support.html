<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Your Personal Blog</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="header-top">
        <div>
          <h1>Support Your Personal Blog</h1>
          <p class="subtitle">This site is free for visitors. Enjoy your own personal blog experience.</p>
        </div>
        <a id="support-link-button" class="support-button" href="/page1">Back to the blog</a>
      </div>
      <nav class="page-nav">
        <a class="page-button" href="/page1">Blog Page 1</a>
        <a class="page-button" href="/page2">Blog Page 2</a>
        <a class="page-button" href="/page3">Blog Page 3</a>
        <a class="page-button" href="/page5">Blog Page 5</a>
        <a class="page-button" href="/page6">Blog Page 6</a>
        <a class="page-button" href="/published">Public Entries</a>
        <a class="page-button" href="/page4">Daily Journal</a>
        <a class="page-button active" href="/support">Support</a>
      </nav>
    </header>

    <section class="entry-form-section">
      <div class="entry-form-card" style="text-align:center;">
        <h2>Support</h2>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <a id="cashapp-link-button" class="support-button" href="#" style="display:none;">Open Cash App Page</a>
        </div>
        <div style="display:flex;justify-content:center;margin-top:14px;">
          <div class="qr-section" style="text-align:center;">
            <img id="cashapp-qr" src="" alt="" style="display:none;width:260px;height:260px;border-radius:12px;border:1px solid #ddd;" />
            <p id="cashapp-qr-note" style="display:none;margin-top:8px;color:#4a3c31;">Scan with your phone to send via Cash App.</p>
          </div>
        </div>
        <div id="admin-upload" style="display:none;margin-top:14px;text-align:left;">
          <label for="qr-type">Choose QR type</label><br/>
          <select id="qr-type">
            <option value="cashapp">Cash App QR</option>
          </select>
          <div style="margin-top:10px;">
            <label for="qr-file">Upload QR image (admin only)</label><br/>
            <input id="qr-file" type="file" accept="image/*" />
            <button id="upload-qr">Upload QR</button>
          </div>
          <p id="upload-status" style="color:#4a3c31;margin-top:8px;"></p>
        </div>
      </div>
    </section>
  </div>
  <script>
    async function initSupportPageLink() {
      const cashAppButton = document.getElementById('cashapp-link-button');
      const cashAppQrImg = document.getElementById('cashapp-qr');
      const cashAppQrNote = document.getElementById('cashapp-qr-note');
      if (!cashAppButton) return;
      try {
        const response = await fetch('/api/settings');
        if (!response.ok) return;
        const settings = await response.json();
        const cashAppUrl = (settings.supportCashAppUrl || settings.supportUrl || '').trim();

        if (cashAppUrl) {
          cashAppButton.href = cashAppUrl;
          cashAppButton.target = '_blank';
          cashAppButton.style.display = 'inline-flex';
        } else {
          cashAppButton.style.display = 'none';
        }

        const cashAppQrPath = (settings.supportCashAppQrPath || settings.supportQrPath || '').trim();

        if (cashAppQrImg && cashAppQrNote && cashAppQrPath) {
          cashAppQrImg.src = cashAppQrPath;
          cashAppQrImg.alt = 'Cash App QR code';
          cashAppQrImg.style.display = 'block';
          cashAppQrNote.style.display = 'block';
        } else if (cashAppQrImg && cashAppQrNote && cashAppUrl && cashAppUrl.includes('cash.app')) {
          const qrData = encodeURIComponent(cashAppUrl);
          cashAppQrImg.src = `https://api.qrserver.com/v1/create-qr-code?size=260x260&data=${qrData}`;
          cashAppQrImg.alt = 'Cash App QR code';
          cashAppQrImg.style.display = 'block';
          cashAppQrNote.style.display = 'block';
        } else if (cashAppQrImg && cashAppQrNote) {
          cashAppQrImg.style.display = 'none';
          cashAppQrNote.style.display = 'none';
        }
      } catch (e) {
        // ignore
      }
    }
    initSupportPageLink();

    async function initAdminUpload() {
      try {
        const resp = await fetch('/api/admin/session', { credentials: 'same-origin' });
        if (!resp.ok) return;
        const obj = await resp.json();
        if (!obj.authenticated) return;
        const wrapper = document.getElementById('admin-upload');
        if (wrapper) wrapper.style.display = 'block';

        const qrType = document.getElementById('qr-type');
        const fileInput = document.getElementById('qr-file');
        const uploadBtn = document.getElementById('upload-qr');
        const status = document.getElementById('upload-status');

        uploadBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          if (!fileInput.files || !fileInput.files[0]) {
            status.textContent = 'Choose a file first.';
            return;
          }
          const file = fileInput.files[0];
          if (file.size > 1024 * 1024 * 3) {
            status.textContent = 'File too large (max 3MB).';
            return;
          }
          status.textContent = 'Uploading...';
          const reader = new FileReader();
          reader.onload = async function () {
            const dataUrl = reader.result;
            try {
              const r = await fetch('/api/support/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ imageData: dataUrl, qrType: qrType ? qrType.value : 'cashapp' })
              });
              const j = await r.json();
              if (!r.ok) {
                status.textContent = j?.error || 'Upload failed.';
                return;
              }
              status.textContent = 'Cash App QR uploaded.';
              initSupportPageLink();
            } catch (err) {
              status.textContent = 'Upload failed.';
            }
          };
          reader.readAsDataURL(file);
        });
      } catch (e) {
        // ignore
      }
    }
    initAdminUpload();
  </script>
</body>
</html>
