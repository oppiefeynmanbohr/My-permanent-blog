<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Personal Blog - Public Entries</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="header-top">
        <div>
          <h1 id="blog-title-display">Your Personal Blog</h1>
          <p class="subtitle">Public Entries</p>
          <input id="blog-title-input" class="blog-title-input" type="text" placeholder="Type your blog name" />
        </div>
        <a id="support-link-button" class="support-button" href="/support">Support</a>
      </div>
      <nav class="page-nav">
        <a class="page-button" href="/page1">Blog Page 1</a>
        <a class="page-button" href="/page2">Blog Page 2</a>
        <a class="page-button" href="/page3">Blog Page 3</a>
        <a class="page-button" href="/page5">Blog Page 5</a>
        <a class="page-button" href="/page6">Blog Page 6</a>
        <a class="page-button" href="/page7">Database</a>
        <a class="page-button" href="/page4">Blog Page 4</a>
        <a class="page-button" href="/dreamstate">Dream State</a>
        <a class="page-button" href="/calendar-journal">Calendar</a>
        <a class="page-button" href="/published">Public Entries</a>
      </nav>
    </header>

    <section class="entries-section">
      <h2>Published Entries</h2>
      <div id="entries-list" class="entries-list"></div>
    </section>
  </div>

  <script>
    function applyBlogTitle(title) {
      const display = document.getElementById('blog-title-display');
      const value = title && title.trim() ? title.trim() : 'Your Personal Blog';
      if (display) display.textContent = value;
      document.title = `${value} - Personal Blog`;
    }

    function loadBlogTitle() {
      try {
        const savedTitle = localStorage.getItem('blogTitle');
        if (savedTitle) {
          const input = document.getElementById('blog-title-input');
          if (input) input.value = savedTitle;
          applyBlogTitle(savedTitle);
          return;
        }
      } catch (e) {
        // ignore storage errors
      }
      applyBlogTitle('Your Personal Blog');
    }

    function saveBlogTitle() {
      try {
        const input = document.getElementById('blog-title-input');
        if (!input) return;
        const value = input.value.trim();
        localStorage.setItem('blogTitle', value);
        applyBlogTitle(value);
      } catch (e) {
        // ignore storage errors
      }
    }

    // Apply saved font preferences if present
    (function applySavedPreferences() {
      try {
        const savedFont = localStorage.getItem('blogFontFamily');
        const savedSize = localStorage.getItem('blogFontSize');
        if (savedFont) document.documentElement.style.setProperty('--blog-font-family', savedFont);
        if (savedSize) document.documentElement.style.setProperty('--blog-font-size', savedSize);
      } catch (e) {
        // ignore
      }
    })();
    async function loadPublishedEntries() {
      const response = await fetch('/api/entries?published=true');
      const entries = await response.json();
      const entriesList = document.getElementById('entries-list');
      entriesList.innerHTML = '';

      if (!entries.length) {
        entriesList.innerHTML = '<p>No published entries yet.</p>';
        return;
      }

      entries.forEach((entry) => {
        const card = document.createElement('article');
        card.className = 'entry-card';
        card.innerHTML = `
          <div class="entry-header">
            <div class="entry-timestamp">${escapeHtml(entry.timestamp)}</div>
          </div>
          <div class="entry-content">${escapeHtml(entry.content)}</div>
        `;
        entriesList.appendChild(card);
      });
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/\'/g, '&#39;')
        .replace(/\n/g, '<br/>');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const titleInput = document.getElementById('blog-title-input');
      if (titleInput) {
        titleInput.addEventListener('input', saveBlogTitle);
      }
      loadBlogTitle();
      loadPublishedEntries();
    });
  </script>
</body>
</html>
