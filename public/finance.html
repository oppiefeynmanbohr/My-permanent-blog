<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Tracker | My Permanent Blog</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #f3f7f5; color: #24352e; }
    .finance-shell { max-width: 1180px; margin: 0 auto; padding: 24px 18px 50px; }
    .finance-hero { background: linear-gradient(135deg, #174b43, #2f7864); color: #fff; border-radius: 14px; padding: 26px; margin-bottom: 22px; }
    .finance-hero h1 { margin: 0 0 6px; }
    .finance-hero p { margin: 0; color: #e4f3ed; }
    .finance-grid { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; align-items: start; }
    .finance-card { background: #fff; border: 1px solid #d5e3dc; border-radius: 10px; padding: 22px; box-shadow: 0 5px 16px rgba(22, 66, 52, .08); }
    .finance-card h2 { margin: 0 0 16px; color: #174b43; }
    .finance-form { display: grid; gap: 11px; }
    .finance-form label { font-weight: 700; font-size: .9rem; }
    .finance-form input, .finance-form select { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #bfd2c8; border-radius: 6px; background: #fcfffd; font: inherit; color: #24352e; }
    .finance-type { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .finance-type label { border: 1px solid #bfd2c8; border-radius: 6px; padding: 10px; text-align: center; cursor: pointer; }
    .finance-type input { width: auto; margin-right: 6px; }
    .finance-submit { border: 0; border-radius: 6px; padding: 12px; background: #1c6a56; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .finance-submit:hover { background: #145342; }
    .finance-status { min-height: 1.2em; color: #557268; font-size: .9rem; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .summary { border-radius: 8px; padding: 14px; background: #eef7f2; }
    .summary strong { display: block; font-size: 1.3rem; margin-top: 4px; }
    .summary.income strong { color: #16704e; }
    .summary.expense strong { color: #b44c39; }
    .summary.balance strong { color: #174b43; }
    .finance-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .finance-toolbar input, .finance-toolbar select { padding: 9px; border: 1px solid #bfd2c8; border-radius: 6px; font: inherit; }
    .finance-list { display: grid; gap: 9px; }
    .finance-record { display: grid; grid-template-columns: 92px 1fr auto auto; gap: 12px; align-items: center; padding: 12px; border-bottom: 1px solid #e1ebe5; }
    .finance-record .kind { font-weight: 700; text-transform: capitalize; }
    .finance-record .kind.income { color: #16704e; }
    .finance-record .kind.expense { color: #b44c39; }
    .finance-record .amount { font-weight: 700; font-variant-numeric: tabular-nums; }
    .finance-record small { display: block; color: #72847c; margin-top: 3px; }
    .finance-delete { border: 1px solid #ddb2aa; color: #a74335; background: #fff8f7; border-radius: 5px; padding: 6px 9px; cursor: pointer; }
    .finance-empty { color: #72847c; padding: 22px 0; text-align: center; }
    @media (max-width: 800px) { .finance-grid { grid-template-columns: 1fr; } .summary-grid { grid-template-columns: 1fr; } .finance-record { grid-template-columns: 76px 1fr auto; } .finance-record .amount { grid-column: 2; } }
  </style>
</head>
<body>
  <div class="finance-shell">
    <header class="finance-hero">
      <h1>Financial Tracker</h1>
      <p>Track pay, expenses, and your balance in one private monthly view.</p>
      <nav class="page-nav" aria-label="Site navigation">
        <a class="page-button" href="/page1">Blog Page 1</a><a class="page-button" href="/page2">Blog Page 2</a><a class="page-button" href="/page3">Blog Page 3</a><a class="page-button" href="/page4">Blog Page 4</a><a class="page-button" href="/page5">Blog Page 5</a><a class="page-button" href="/page6">Blog Page 6</a><a class="page-button" href="/page7">Vision Board</a><a class="page-button active" href="/finance">Finance</a><a class="page-button" href="/library">Library</a><a class="page-button" href="/encyclopedia">Encyclopedia</a><a class="page-button" href="/alarm">Alarm</a>
      </nav>
    </header>
    <main class="finance-grid">
      <section class="finance-card">
        <h2>Add a record</h2>
        <form id="finance-form" class="finance-form">
          <label>Record type</label>
          <div class="finance-type"><label><input type="radio" name="kind" value="income" checked /> Pay / income</label><label><input type="radio" name="kind" value="expense" /> Expense</label></div>
          <label for="finance-amount">Amount</label><input id="finance-amount" type="number" min="0.01" step="0.01" placeholder="0.00" required />
          <label for="finance-category">Category</label><select id="finance-category"><option>Paycheck</option><option>Housing</option><option>Food</option><option>Transportation</option><option>Utilities</option><option>Health</option><option>Debt</option><option>Education</option><option>Entertainment</option><option>Savings</option><option>Other</option></select>
          <label for="finance-description">Description</label><input id="finance-description" maxlength="300" placeholder="Optional note" />
          <label for="finance-date">Date</label><input id="finance-date" type="date" required />
          <button class="finance-submit" type="submit">Add record</button><div id="finance-status" class="finance-status" aria-live="polite"></div>
        </form>
      </section>
      <section class="finance-card">
        <h2>Budget overview</h2>
        <div class="summary-grid"><div class="summary income">Income<strong id="total-income">$0.00</strong></div><div class="summary expense">Expenses<strong id="total-expenses">$0.00</strong></div><div class="summary balance">Balance<strong id="total-balance">$0.00</strong></div></div>
        <div class="finance-toolbar"><label for="finance-month">Month</label><input id="finance-month" type="month" /><select id="finance-filter"><option value="">All records</option><option value="income">Income only</option><option value="expense">Expenses only</option></select></div>
        <div id="finance-list" class="finance-list"></div>
      </section>
    </main>
  </div>
  <script>
    let financeRecords = [];
    const money = (value) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(Number(value) || 0);
    const escapeFinance = (value) => String(value || '').replace(/[&<>'"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c]));
    const today = new Date();
    document.getElementById('finance-date').value = today.toISOString().slice(0, 10);
    document.getElementById('finance-month').value = today.toISOString().slice(0, 7);
    async function loadFinance() { try { const response = await fetch('/api/finance-records', { credentials:'same-origin' }); if (!response.ok) throw new Error(); financeRecords = await response.json(); renderFinance(); } catch { document.getElementById('finance-list').innerHTML = '<div class="finance-empty">Sign in to use your private financial tracker.</div>'; } }
    function renderFinance() { const month = document.getElementById('finance-month').value; const filter = document.getElementById('finance-filter').value; const records = financeRecords.filter(record => (!month || record.record_date.startsWith(month)) && (!filter || record.kind === filter)); const income = records.filter(r => r.kind === 'income').reduce((sum, r) => sum + Number(r.amount), 0); const expenses = records.filter(r => r.kind === 'expense').reduce((sum, r) => sum + Number(r.amount), 0); document.getElementById('total-income').textContent = money(income); document.getElementById('total-expenses').textContent = money(expenses); document.getElementById('total-balance').textContent = money(income - expenses); document.getElementById('finance-list').innerHTML = records.length ? records.map(record => `<div class="finance-record"><span class="kind ${record.kind}">${record.kind}</span><div><strong>${escapeFinance(record.category)}</strong><small>${escapeFinance(record.description)}${record.description ? ' · ' : ''}${escapeFinance(record.record_date)}</small></div><span class="amount">${record.kind === 'income' ? '+' : '-'}${money(record.amount)}</span><button class="finance-delete" data-id="${record.id}" type="button">Delete</button></div>`).join('') : '<div class="finance-empty">No records for this view yet.</div>'; }
    document.getElementById('finance-form').addEventListener('submit', async event => { event.preventDefault(); const form = event.target; const status = document.getElementById('finance-status'); const body = { kind: form.querySelector('input[name="kind"]:checked').value, amount: document.getElementById('finance-amount').value, category: document.getElementById('finance-category').value, description: document.getElementById('finance-description').value, recordDate: document.getElementById('finance-date').value }; try { const response = await fetch('/api/finance-records', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.error || 'Could not save record.'); form.reset(); document.getElementById('finance-date').value = today.toISOString().slice(0,10); status.textContent = 'Record added.'; await loadFinance(); } catch (error) { status.textContent = error.message; } });
    document.getElementById('finance-month').addEventListener('change', renderFinance); document.getElementById('finance-filter').addEventListener('change', renderFinance);
    document.getElementById('finance-list').addEventListener('click', async event => { const button = event.target.closest('.finance-delete'); if (!button) return; await fetch(`/api/finance-records/${encodeURIComponent(button.dataset.id)}`, { method:'DELETE', credentials:'same-origin' }); await loadFinance(); });
    loadFinance();
  </script>
</body>
</html>
