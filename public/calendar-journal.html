<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Journal</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 18px;
    }
    .cal-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #1a2a3a;
      min-width: 200px;
      text-align: center;
    }
    .cal-nav {
      background: #9B1C31;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 1rem;
    }
    .cal-nav:hover { background: #7a1525; }
    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .day-btn {
      aspect-ratio: 1;
      border: 2px solid rgba(93,138,168,0.25);
      border-radius: 10px;
      background: #F8F8FF;
      color: #1a2a3a;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
      position: relative;
    }
    .day-btn:hover { background: rgba(93,138,168,0.15); transform: scale(1.05); }
    .day-btn.today { border-color: #9B1C31; color: #9B1C31; }
    .day-btn.has-entry { background: rgba(93,138,168,0.2); }
    .day-btn.selected { background: #9B1C31; color: white; border-color: #9B1C31; }
    .day-btn.has-entry::after {
      content: '●';
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 0.5rem;
      color: #5D8AA8;
    }
    .day-btn.selected.has-entry::after { color: rgba(255,255,255,0.7); }
    .day-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #5D8AA8;
      text-align: center;
      padding: 4px 0;
    }
    .entry-panel {
      background: #F8F8FF;
      border: 1px solid rgba(93,138,168,0.25);
      border-radius: 16px;
      padding: 20px;
    }
    .entry-panel h3 { margin: 0 0 12px; color: #1a2a3a; }
    .entry-panel textarea {
      width: 100%;
      min-height: 180px;
      box-sizing: border-box;
      border: 1px solid rgba(93,138,168,0.3);
      border-radius: 8px;
      padding: 12px;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      background: white;
      color: #1a2a3a;
    }
    .entry-panel textarea:focus { outline: 2px solid #9B1C31; }
    .entry-actions { display: flex; gap: 12px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
    .day-status { font-size: 0.9em; color: #5D8AA8; }
    .empty-day { color: #888; font-style: italic; padding: 8px 0; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="header-top">
        <div>
          <h1>Calendar Journal</h1>
          <p class="subtitle">Write an entry for any day of the month</p>
        </div>
        <a class="support-button" href="/support">Support</a>
      </div>
      <nav class="page-nav">
        <a class="page-button" href="/page1">Blog Page 1</a>
        <a class="page-button" href="/page2">Blog Page 2</a>
        <a class="page-button" href="/page3">Blog Page 3</a>
        <a class="page-button" href="/page5">Blog Page 5</a>
        <a class="page-button" href="/page6">Blog Page 6</a>
        <a class="page-button" href="/page7">Database</a>
        <a class="page-button" href="/page4">Blog Page 4</a>
        <a class="page-button" href="/dreamstate">Dream State</a>
        <a class="page-button active" href="/calendar-journal">Calendar</a>
        <a class="page-button" href="/library">Library</a>
        <a class="page-button" href="/published">Public Entries</a>
      </nav>
    </header>

    <section class="entry-form-section">
      <div class="entry-form-card">

        <div class="cal-header">
          <button class="cal-nav" id="prev-month">&#8592;</button>
          <div class="cal-title" id="cal-title"></div>
          <button class="cal-nav" id="next-month">&#8594;</button>
        </div>

        <!-- Day-of-week headers -->
        <div class="day-grid" id="dow-headers">
          <div class="day-label">Sun</div>
          <div class="day-label">Mon</div>
          <div class="day-label">Tue</div>
          <div class="day-label">Wed</div>
          <div class="day-label">Thu</div>
          <div class="day-label">Fri</div>
          <div class="day-label">Sat</div>
        </div>

        <div class="day-grid" id="day-grid"></div>

        <div class="entry-panel" id="entry-panel" style="display:none;">
          <h3 id="entry-day-label"></h3>

          <!-- New entry form -->
          <textarea id="day-entry-content" placeholder="Write a new entry for this day..."></textarea>
          <div class="entry-actions">
            <button id="save-day-entry">+ Save Entry</button>
            <span class="day-status" id="day-status"></span>
          </div>

          <!-- Existing entries for the day -->
          <div id="day-entries-list" style="margin-top:18px;"></div>
        </div>

      </div>
    </section>

    <footer class="site-footer">
      <p>© 2026 My Permanent Blog. All rights reserved.</p>
    </footer>
  </div>

  <script>
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const today = new Date();
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth();
    let selectedDay = null;
    // entryMap: 'YYYY-MM-DD' -> [ { id, content, timestamp } ]
    let entryMap = {};

    // Redirect to login if not authenticated
    fetch('/api/auth/session', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(d => { if (!d.authenticated) window.location.href = '/login'; })
      .catch(() => {});

    function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
    function firstDayOfWeek(y, m) { return new Date(y, m, 1).getDay(); }
    function padDate(n) { return String(n).padStart(2, '0'); }
    function dateKey(y, m, d) { return `${y}-${padDate(m+1)}-${padDate(d)}`; }
    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function loadMonthEntries() {
      const r = await fetch(`/api/entries?source=calendar&calmonth=${viewYear}-${padDate(viewMonth+1)}`, { credentials: 'same-origin' }).catch(() => null);
      entryMap = {};
      if (r && r.ok) {
        const entries = await r.json();
        entries.forEach(e => {
          const d = (e.created_at || '').slice(0, 10);
          if (!d) return;
          if (!entryMap[d]) entryMap[d] = [];
          entryMap[d].push({ id: e.id, content: e.content, timestamp: e.timestamp });
        });
      }
      renderCalendar();
      if (selectedDay !== null) renderDayEntries(dateKey(viewYear, viewMonth, selectedDay));
    }

    function renderCalendar() {
      document.getElementById('cal-title').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
      const grid = document.getElementById('day-grid');
      grid.innerHTML = '';
      const total = daysInMonth(viewYear, viewMonth);
      const startDow = firstDayOfWeek(viewYear, viewMonth);
      const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
      for (let i = 0; i < startDow; i++) grid.appendChild(document.createElement('div'));
      for (let d = 1; d <= total; d++) {
        const key = dateKey(viewYear, viewMonth, d);
        const btn = document.createElement('button');
        btn.className = 'day-btn';
        btn.textContent = d;
        if (key === todayKey) btn.classList.add('today');
        if (entryMap[key] && entryMap[key].length) btn.classList.add('has-entry');
        if (selectedDay === d) btn.classList.add('selected');
        btn.addEventListener('click', () => selectDay(d));
        grid.appendChild(btn);
      }
    }

    function selectDay(day) {
      selectedDay = day;
      renderCalendar();
      const key = dateKey(viewYear, viewMonth, day);
      document.getElementById('entry-panel').style.display = 'block';
      document.getElementById('entry-day-label').textContent = `${MONTHS[viewMonth]} ${day}, ${viewYear}`;
      document.getElementById('day-entry-content').value = '';
      document.getElementById('day-status').textContent = '';
      renderDayEntries(key);
      document.getElementById('day-entry-content').focus();
    }

    function renderDayEntries(key) {
      const list = document.getElementById('day-entries-list');
      const entries = entryMap[key] || [];
      if (!entries.length) { list.innerHTML = '<p style="color:#888;font-style:italic;font-size:0.9em;">No entries yet for this day.</p>'; return; }
      list.innerHTML = entries.map((e, i) => `
        <div class="saved-entry-card" id="entry-card-${e.id}" style="background:#fff;border:1px solid rgba(93,138,168,0.3);border-radius:10px;padding:14px;margin-bottom:12px;">
          <div style="font-size:0.8em;color:#5D8AA8;margin-bottom:6px;">${esc(e.timestamp)}</div>
          <div id="entry-view-${e.id}" class="entry-body" style="white-space:pre-wrap;line-height:1.6;color:#1a2a3a;">${esc(e.content)}</div>
          <textarea id="entry-edit-${e.id}" style="display:none;width:100%;min-height:100px;box-sizing:border-box;border:1px solid #9B1C31;border-radius:6px;padding:10px;font-family:inherit;font-size:1rem;resize:vertical;">${esc(e.content)}</textarea>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
            <button class="secondary-button" onclick="startEdit(${e.id})" id="edit-btn-${e.id}" style="font-size:0.82em;padding:5px 12px;">Edit</button>
            <button class="secondary-button" onclick="saveEdit(${e.id}, '${esc(key)}')" id="save-edit-btn-${e.id}" style="display:none;font-size:0.82em;padding:5px 12px;background:#9B1C31;color:#fff;border-color:#9B1C31;">Save Edit</button>
            <button class="secondary-button" onclick="cancelEdit(${e.id})" id="cancel-edit-btn-${e.id}" style="display:none;font-size:0.82em;padding:5px 12px;">Cancel</button>
            <button onclick="deleteEntry(${e.id}, '${esc(key)}')" style="font-size:0.82em;padding:5px 12px;background:#fff0f0;color:#c62828;border:1px solid #f5c0c0;border-radius:6px;cursor:pointer;">Delete</button>
          </div>
          <div id="edit-status-${e.id}" style="font-size:0.82em;color:#c62828;margin-top:4px;"></div>
        </div>`).join('');
    }

    function startEdit(id) {
      document.getElementById(`entry-view-${id}`).style.display = 'none';
      document.getElementById(`entry-edit-${id}`).style.display = 'block';
      document.getElementById(`edit-btn-${id}`).style.display = 'none';
      document.getElementById(`save-edit-btn-${id}`).style.display = 'inline-block';
      document.getElementById(`cancel-edit-btn-${id}`).style.display = 'inline-block';
      document.getElementById(`entry-edit-${id}`).focus();
    }
    function cancelEdit(id) {
      document.getElementById(`entry-view-${id}`).style.display = 'block';
      document.getElementById(`entry-edit-${id}`).style.display = 'none';
      document.getElementById(`edit-btn-${id}`).style.display = 'inline-block';
      document.getElementById(`save-edit-btn-${id}`).style.display = 'none';
      document.getElementById(`cancel-edit-btn-${id}`).style.display = 'none';
    }
    async function saveEdit(id, key) {
      const content = document.getElementById(`entry-edit-${id}`).value.trim();
      const statusEl = document.getElementById(`edit-status-${id}`);
      if (!content) { statusEl.textContent = 'Entry cannot be empty.'; return; }
      statusEl.textContent = 'Saving...';
      try {
        const r = await fetch(`/api/entries/${id}/content`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin', body: JSON.stringify({ content })
        });
        const data = await r.json();
        if (!r.ok) { statusEl.textContent = data.error || 'Save failed.'; return; }
        // Update local map
        const arr = entryMap[key];
        if (arr) { const e = arr.find(x => x.id === id); if (e) e.content = content; }
        cancelEdit(id);
        document.getElementById(`entry-view-${id}`).textContent = content;
        statusEl.textContent = '';
      } catch { statusEl.textContent = 'Network error. Try again.'; }
    }
    async function deleteEntry(id, key) {
      if (!confirm('Delete this entry permanently?')) return;
      const r = await fetch(`/api/entries/${id}`, { method: 'DELETE', credentials: 'same-origin' }).catch(() => null);
      if (r && r.ok) {
        if (entryMap[key]) entryMap[key] = entryMap[key].filter(e => e.id !== id);
        renderCalendar();
        renderDayEntries(key);
      }
    }

    document.getElementById('save-day-entry').addEventListener('click', async () => {
      const key = dateKey(viewYear, viewMonth, selectedDay);
      const content = document.getElementById('day-entry-content').value.trim();
      const status = document.getElementById('day-status');
      if (!content) { status.textContent = 'Write something first.'; return; }
      status.textContent = 'Saving...';
      const dateStr = `${viewYear}-${padDate(viewMonth+1)}-${padDate(selectedDay)}`;
      try {
        const r = await fetch('/api/entries', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ content, source: 'calendar', caldate: dateStr })
        });
        if (r.status === 401) {
          status.textContent = 'Session expired — redirecting to login...';
          setTimeout(() => { window.location.href = '/login'; }, 1200); return;
        }
        if (!r.ok) { status.textContent = 'Could not save. Try again.'; return; }
        const newEntry = await r.json();
        if (!entryMap[key]) entryMap[key] = [];
        entryMap[key].push({ id: newEntry.id, content: newEntry.content, timestamp: newEntry.timestamp });
        document.getElementById('day-entry-content').value = '';
        status.textContent = 'Saved!';
        setTimeout(() => { status.textContent = ''; }, 2000);
        renderCalendar();
        renderDayEntries(key);
      } catch { status.textContent = 'Network error. Try again.'; }
    });

    document.getElementById('prev-month').addEventListener('click', () => {
      viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      selectedDay = null;
      document.getElementById('entry-panel').style.display = 'none';
      loadMonthEntries();
    });
    document.getElementById('next-month').addEventListener('click', () => {
      viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      selectedDay = null;
      document.getElementById('entry-panel').style.display = 'none';
      loadMonthEntries();
    });

    try {
      const t = localStorage.getItem('blogTitle');
      if (t) document.title = `${t} - Calendar Journal`;
      const f = localStorage.getItem('blogFontFamily');
      const s = localStorage.getItem('blogFontSize');
      if (f) document.documentElement.style.setProperty('--blog-font-family', f);
      if (s) document.documentElement.style.setProperty('--blog-font-size', s);
    } catch {}

    loadMonthEntries();
  </script>
</body>
</html>
